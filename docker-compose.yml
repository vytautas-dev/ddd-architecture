services:
  postgres:
    image: postgres:16-alpine
    # the Hermes outbox reads the WAL through logical replication
    command: ["postgres", "-c", "wal_level=logical"]
    environment:
      POSTGRES_USER: bidflow
      POSTGRES_PASSWORD: bidflow
      POSTGRES_DB: bidflow
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pulsar:
    image: apachepulsar/pulsar:4.0.14
    command: ["bin/pulsar", "standalone"]
    ports:
      - "6650:6650" # broker (PULSAR_URL)
      - "8080:8080" # admin REST API
    volumes:
      - pulsar_data:/pulsar/data
    healthcheck:
      test: ["CMD", "bin/pulsar-admin", "brokers", "healthcheck"]
      interval: 5s
      timeout: 10s
      retries: 20

  # Pulsar web UI — topics, subscriptions, backlogs, dead letters.
  # Open http://localhost:8090 (or http://127.0.0.1:8090 if localhost resolves to IPv6).
  dekaf:
    image: visortelle/dekaf:1.2.1
    environment:
      DEKAF_PULSAR_WEB_URL: "http://pulsar:8080"
      DEKAF_PULSAR_BROKER_URL: "pulsar://pulsar:6650"
    ports:
      - "8090:8090"
    volumes:
      - dekaf_library:/dekaf/data/library
    depends_on:
      pulsar:
        condition: service_healthy

volumes:
  postgres_data:
  pulsar_data:
  dekaf_library:
